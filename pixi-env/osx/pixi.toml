[workspace]
authors = ["Mike Smyth <Mike.M.Smyth@jpl.nasa.gov>"]
channels = ["conda-forge", "/Users/smyth/afids-conda-package/afids-conda-channel"]
name = "build-pixi"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]

[tasks.configure]
cmd="pixi run ../../afids/configure --prefix=$CONDA_PREFIX CPPFLAGS=\"-I $CONDA_PREFIX/include/tirpc $CPPFLAGS\" --with-afids-test-data=$AFIDS_TEST_DATA --with-spice=$CONDA_PREFIX"

[activation.env]
AFIDS_TEST_DATA = "/Users/smyth/Afids/afids-test-data"

[dependencies]
git = ">=2.51.0,<3"
perl = ">=5.32.1,<5.33"
patch = ">=2.8,<3"
make = ">=4.4.1,<5"
ncurses = ">=6.5,<7"
compilers = ">=1.11.0,<2"
libtool = ">=2.5.4,<3"
automake = ">=1.17,<2"
autoconf = ">=2.72,<3"
pkg-config = ">=0.29.2,<0.30"
vicar-rtl = ">=1.11,<2"
vicar = ">=1.14,<2"
afids-data = ">=1.12,<2"
gdal = ">=3.11.4,<4"
libgdal = ">=3.11.4,<4"
boost = ">=1.84.0,<2"
afids-carto = ">=1.6,<2"
blas = ">=2.136,<3"
tix = ">=8.4.3,<9"
itcl = ">=4.2.2,<5"
tk = ">=8.6.13,<9"
gsl = ">=2.8,<3"
hdfeos2 = ">=2.20,<3"
geotiff = ">=1.7.4,<2"
fftw = ">=3.3.10,<4"
vicar-gdalplugin = ">=1.13,<2"
gnuplot = ">=5.4.10,<6"
libtirpc = ">=1.3.7,<2"
spice = ">=67.0,<68"
